name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # LogCut uses a CLA rather than a DCO. Unlike a sign-off, a CLA needs state:
  # who signed, when, and against which version. The action stores signatures in
  # signatures/cla.json on this repository, so there is no external service
  # holding the record. See CLA.md.
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/logcut/logcut/blob/main/CLA.md'
          branch: 'main'
          allowlist: yuanzhixiang,bot*
