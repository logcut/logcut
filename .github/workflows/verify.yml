name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The core must stay platform neutral: no runtime deps, no Node builtins,
      # no DOM, no I/O. This is what lets the web app reuse it unchanged.
      - run: pnpm check:core
      - run: pnpm format:check
      # Hook call order and dependency arrays only; see apps/desktop/eslint.config.mjs.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
