name: dco

on:
  pull_request:

jobs:
  # LogCut uses the Developer Certificate of Origin instead of a CLA, so every
  # commit has to carry a Signed-off-by line. See CONTRIBUTING.md.
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git show -s --format=%s "$sha")
            if git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              echo "ok      ${sha:0:8} $subject"
            else
              echo "::error::${sha:0:8} $subject — missing Signed-off-by"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "Fix the most recent commit with:   git commit --amend -s"
            echo "Fix every commit in this PR with:  git rebase --signoff $BASE"
            echo "Then force-push the branch."
            exit 1
          fi
