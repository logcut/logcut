name: package

on:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: 'ffmpeg release tag to bundle (e.g. ffmpeg-b1)'
        required: true

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Download ffmpeg sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.ffmpeg_tag }}" -p 'ffmpeg-darwin-arm64.tar.gz'
          mkdir -p apps/desktop/vendor/ffmpeg
          tar -xzf ffmpeg-darwin-arm64.tar.gz -C apps/desktop/vendor/ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Package (unsigned dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter logcut package:mac
      - uses: actions/upload-artifact@v7
        with:
          name: logcut-mac-arm64
          path: apps/desktop/release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Download ffmpeg sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "${{ inputs.ffmpeg_tag }}" -p 'ffmpeg-win32-x64.tar.gz'
          mkdir -p apps/desktop/vendor/ffmpeg
          tar -xzf ffmpeg-win32-x64.tar.gz -C apps/desktop/vendor/ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Package (unsigned nsis)
        run: pnpm --filter logcut package:win
      - uses: actions/upload-artifact@v7
        with:
          name: logcut-win-x64
          path: apps/desktop/release/*.exe
      # A no-installer build for testing: the nsis installer refuses to
      # overwrite an existing install of the same version, which makes it
      # useless for trying a fix before the version is bumped. Kept in its own
      # output directory so it never lands among the release assets.
      - name: Package (unsigned zip)
        run: pnpm --filter logcut package:win:zip
      - uses: actions/upload-artifact@v7
        with:
          name: logcut-win-x64-zip
          path: apps/desktop/release-zip/*.zip
