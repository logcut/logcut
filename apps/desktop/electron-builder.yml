appId: com.logcut.desktop
productName: LogCut
directories:
  output: release

files:
  - out/**
  - package.json
  - '!node_modules/**'

mac:
  category: public.app-category.video
  minimumSystemVersion: '13.0'
  icon: assets/app-icon.png
  # Notarization requires the hardened runtime; the runtime requires the
  # exceptions in the plist or Chromium cannot start. See that file.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Reads APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the
  # environment and submits through notarytool.
  notarize: true
  target:
    # dmg is what a person downloads; zip is what auto-update consumes.
    # Squirrel.Mac cannot install from a dmg, so dropping zip silently breaks
    # updates while the release still looks complete.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extraResources:
    - from: vendor/ffmpeg/darwin-${arch}/
      to: ffmpeg/

win:
  icon: assets/app-icon.png
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: vendor/ffmpeg/win32-${arch}/
      to: ffmpeg/

linux:
  category: AudioVideo
  icon: assets/app-icon.png
  # AppImage only, and that is a deliberate narrowing: it is the one Linux
  # format electron-updater can install into. A .deb would have to be updated
  # through the distro's package manager, which we do not publish to, so it
  # would be a build that silently never updates.
  target:
    - target: AppImage
      arch: [x64]
  extraResources:
    - from: vendor/ffmpeg/linux-${arch}/
      to: ffmpeg/

nsis:
  oneClick: true
  deleteAppDataOnUninstall: false

# Auto-update reads its metadata from the GitHub release: electron-builder
# writes latest.yml / latest-mac.yml alongside the installers, and without
# them the client has no way to learn a new version exists. Uploading the
# installers by hand — which is what the release flow used to do — produces a
# release that looks complete and updates nothing.
publish:
  provider: github
  owner: logcut
  repo: logcut
