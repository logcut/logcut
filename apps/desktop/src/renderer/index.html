<!doctype html>
<!-- LogCut defaults to dark mode; the adapter's .dark block keys off this class. -->
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>LogCut</title>
    <!-- img-src needs data: because Vite inlines assets under 4 KB, which is
         how the imported brand mark reaches the renderer, and logcut-media:
         because poster frames are served over the media protocol. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: logcut-media:; media-src 'self' logcut-media:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
